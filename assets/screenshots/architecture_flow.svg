<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="45" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">END-TO-END UNATTENDED PIPELINE ARCHITECTURE</text>
  <text x="50" y="68" fill="#64748b" font-size="13">Autonomous Discovery • Zero-Hallucination Tailoring • Playwright Submission • Audit Verification</text>

  <!-- Stage 1 -->
  <g transform="translate(50, 95)">
    <rect width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#23324d" stroke-width="1.5" />
    <rect width="195" height="4" rx="2" fill="#6366f1" />
    <rect x="14" y="18" width="56" height="20" rx="4" fill="rgba(99, 102, 241, 0.15)" />
    <text x="24" y="32" fill="#818cf8" font-size="10" font-weight="700">STAGE 1</text>
    <text x="14" y="62" fill="#f1f5f9" font-size="14" font-weight="700">Job Scraper</text>
    <text x="14" y="80" fill="#06b6d4" font-size="11" font-family="monospace">scraper.py</text>
    <text x="14" y="106" fill="#94a3b8" font-size="11" width="160">
      <tspan x="14" dy="0">• Playwright Async</tspan>
      <tspan x="14" dy="16">• Greenhouse &amp; Lever</tspan>
      <tspan x="14" dy="16">• targets.json registry</tspan>
      <tspan x="14" dy="16">• Keyword matching</tspan>
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(252, 175)">
    <path d="M 0 0 L 25 0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4,2" />
    <polygon points="25,-4 33,0 25,4" fill="#06b6d4" />
  </g>

  <!-- Stage 2 -->
  <g transform="translate(290, 95)">
    <rect width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#23324d" stroke-width="1.5" />
    <rect width="195" height="4" rx="2" fill="#06b6d4" />
    <rect x="14" y="18" width="56" height="20" rx="4" fill="rgba(6, 182, 212, 0.15)" />
    <text x="24" y="32" fill="#22d3ee" font-size="10" font-weight="700">STAGE 2</text>
    <text x="14" y="62" fill="#f1f5f9" font-size="14" font-weight="700">Deduplication</text>
    <text x="14" y="80" fill="#06b6d4" font-size="11" font-family="monospace">sheet_manager.py</text>
    <text x="14" y="106" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">• Google Sheets check</tspan>
      <tspan x="14" dy="16">• gspread &amp; google-auth</tspan>
      <tspan x="14" dy="16">• URL index lookup</tspan>
      <tspan x="14" dy="16">• Skips duplicate jobs</tspan>
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(492, 175)">
    <path d="M 0 0 L 25 0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4,2" />
    <polygon points="25,-4 33,0 25,4" fill="#06b6d4" />
  </g>

  <!-- Stage 3 -->
  <g transform="translate(530, 95)">
    <rect width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#23324d" stroke-width="1.5" />
    <rect width="195" height="4" rx="2" fill="#8b5cf6" />
    <rect x="14" y="18" width="56" height="20" rx="4" fill="rgba(139, 92, 246, 0.15)" />
    <text x="24" y="32" fill="#a78bfa" font-size="10" font-weight="700">STAGE 3</text>
    <text x="14" y="62" fill="#f1f5f9" font-size="14" font-weight="700">LLM Tailoring</text>
    <text x="14" y="80" fill="#a78bfa" font-size="11" font-family="monospace">resume_tailor.py</text>
    <text x="14" y="106" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">• Zero-Hallucination</tspan>
      <tspan x="14" dy="16">• Gemini 2.5 Flash / OpenAI</tspan>
      <tspan x="14" dy="16">• master_resume.md truth</tspan>
      <tspan x="14" dy="16">• PDF compiled to output/</tspan>
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(732, 175)">
    <path d="M 0 0 L 25 0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4,2" />
    <polygon points="25,-4 33,0 25,4" fill="#06b6d4" />
  </g>

  <!-- Stage 4 -->
  <g transform="translate(770, 95)">
    <rect width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#23324d" stroke-width="1.5" />
    <rect width="195" height="4" rx="2" fill="#10b981" />
    <rect x="14" y="18" width="56" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="24" y="32" fill="#34d399" font-size="10" font-weight="700">STAGE 4</text>
    <text x="14" y="62" fill="#f1f5f9" font-size="14" font-weight="700">Playwright Bot</text>
    <text x="14" y="80" fill="#34d399" font-size="11" font-family="monospace">apply_bot.py</text>
    <text x="14" y="106" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">• Human keystroke pacing</tspan>
      <tspan x="14" dy="16">• Uploads tailored PDF</tspan>
      <tspan x="14" dy="16">• Consent checks &amp; CAPTCHA</tspan>
      <tspan x="14" dy="16">• AUTO_SUBMIT execution</tspan>
    </text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(972, 175)">
    <path d="M 0 0 L 25 0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4,2" />
    <polygon points="25,-4 33,0 25,4" fill="#06b6d4" />
  </g>

  <!-- Stage 5 -->
  <g transform="translate(1010, 95)">
    <rect width="140" height="175" rx="12" fill="url(#cardGrad)" stroke="#23324d" stroke-width="1.5" />
    <rect width="140" height="4" rx="2" fill="#f59e0b" />
    <rect x="14" y="18" width="56" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)" />
    <text x="24" y="32" fill="#fbbf24" font-size="10" font-weight="700">STAGE 5</text>
    <text x="14" y="62" fill="#f1f5f9" font-size="14" font-weight="700">Audit &amp; State</text>
    <text x="14" y="80" fill="#fbbf24" font-size="11" font-family="monospace">sheet_manager</text>
    <text x="14" y="106" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">• Timestamp status</tspan>
      <tspan x="14" dy="16">• Visual screenshot</tspan>
      <tspan x="14" dy="16">• Anti-bot delays</tspan>
      <tspan x="14" dy="16">• Google Sheet sync</tspan>
    </text>
  </g>
</svg>
