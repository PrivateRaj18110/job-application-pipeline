<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raj Yadav | Python Backend &amp; Applied AI Engineer</title>
  <meta name="description" content="I build Python backends, LLM-powered automation and event-driven systems, with a finance background to match.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Raj Yadav | Python Backend &amp; Applied AI Engineer">
  <meta property="og:description" content="I build Python backends, LLM-powered automation and event-driven systems, with a finance background to match.">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try {
      var savedTheme = localStorage.getItem('portfolio-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-nav">
    <div class="wrap nav-inner">
      <a class="nav-brand" href="#top">
        <span class="nav-mark" id="nav-mark" aria-hidden="true"></span>
        <span id="nav-name"></span>
      </a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#education">Education</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode"></button>
        <a class="btn btn-primary btn-small" href="resume.pdf" download>Download CV</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" id="top">
      <div class="hero-main" id="hero-main"></div>
      <aside class="hero-card" id="hero-card" aria-label="At a glance"></aside>
    </section>

    <section class="section wrap" id="skills">
      <div class="section-head">
        <h2>Skills</h2>
        <p>Pick a skill to see the projects that use it.</p>
      </div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section class="section wrap" id="projects">
      <div class="section-head">
        <h2>Projects</h2>
        <p id="projects-caption"></p>
      </div>
      <div class="filter-bar" id="project-filters" role="toolbar" aria-label="Filter projects by category"></div>
      <div class="active-skill" id="active-skill" hidden></div>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <section class="section wrap" id="experience">
      <div class="section-head">
        <h2>Experience</h2>
      </div>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="section wrap" id="education">
      <div class="section-head">
        <h2>Education & credentials</h2>
      </div>
      <div class="edu-grid">
        <div class="edu-list" id="edu-list"></div>
        <div class="creds" id="creds"></div>
      </div>
    </section>

    <section class="section wrap" id="contact">
      <div class="contact-card" id="contact-card"></div>
    </section>
  </main>

  <footer class="site-footer wrap" id="site-footer"></footer>

  <noscript><p class="wrap">This page needs JavaScript to render the CV. You can also <a href="resume.pdf">download the PDF</a>.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
