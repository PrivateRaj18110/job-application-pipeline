<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project case study</title>
  <meta name="description" content="Project case study: what it does, how it is built, and what it achieved.">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try {
      var savedTheme = localStorage.getItem('portfolio-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
</head>
<body data-page="project">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-nav">
    <div class="wrap nav-inner">
      <a class="nav-brand" href="./">
        <span class="nav-mark" id="nav-mark" aria-hidden="true"></span>
        <span id="nav-name"></span>
      </a>
      <nav class="nav-links" aria-label="Sections">
        <a href="./#skills">Skills</a>
        <a href="./#projects">Projects</a>
        <a href="./#experience">Experience</a>
        <a href="./#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode"></button>
        <a class="btn btn-primary btn-small" href="resume.pdf" download>Download CV</a>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="site-footer wrap" id="site-footer"></footer>

  <dialog class="lightbox" id="lightbox" aria-label="Screenshot">
    <button class="icon-btn lightbox-close" type="button" id="lightbox-close" aria-label="Close">✕</button>
    <img id="lightbox-img" src="" alt="">
    <p id="lightbox-caption"></p>
  </dialog>

  <noscript><p class="wrap">This page needs JavaScript to render the project. You can also <a href="resume.pdf">download the CV</a>.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
